[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trae-learning-app"
version = "0.1.0"
description = "A local programming learning application"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools]
packages = ["app"]
